<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice | Princess Casino</title>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #fbbf24; } .logo span { color: #ec4899; }
    .balance-box { background: #0f172a; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 6px; color: #4ade80; font-weight: bold; }
    .btn-back { background: #334155; color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; }
    
    .game-container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; width: 100%; box-sizing: border-box; }
    .panel { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; margin-bottom: 1rem; }
    
    .dice-display { width: 150px; height: 150px; margin: 2rem auto; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 5rem; box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); transition: transform 0.3s; }
    .dice-display.rolling { animation: roll 0.5s ease-in-out; }
    @keyframes roll { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(720deg) scale(1.2); } 100% { transform: rotate(0deg) scale(1); } }
    
    .slider-container { margin: 2rem 0; }
    .slider-label { display: flex; justify-content: space-between; margin-bottom: 1rem; color: #94a3b8; font-weight: 600; }
    input[type=range] { width: 100%; height: 10px; background: #0f172a; border-radius: 5px; outline: none; -webkit-appearance: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 25px; height: 25px; background: #3b82f6; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 2rem 0; }
    .stat-box { background: #0f172a; padding: 1rem; border-radius: 8px; text-align: center; border: 1px solid #334155; }
    .stat-label { font-size: 0.8rem; color: #64748b; margin-bottom: 0.5rem; }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: #fbbf24; }
    
    .toggle-group { display: flex; background: #0f172a; border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem; border: 1px solid #334155; }
    .toggle-btn { flex: 1; padding: 1rem; background: transparent; border: none; color: #64748b; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .toggle-btn.active { background: #3b82f6; color: white; }
    
    .btn-roll { width: 100%; padding: 1.25rem; background: linear-gradient(135deg, #22c55e, #16a34a); border: none; border-radius: 8px; color: white; font-size: 1.3rem; font-weight: 800; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #15803d; transition: all 0.1s; }
    .btn-roll:active { transform: translateY(4px); box-shadow: none; }
    .btn-roll:disabled { background: #475569; color: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }
    
    .result-display { text-align: center; margin-top: 1.5rem; font-size: 1.5rem; font-weight: 700; min-height: 2rem; }
    .win { color: #22c55e; text-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
    .lose { color: #ef4444; }
    
    .bet-controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .bet-input { flex: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 1rem; border-radius: 8px; font-size: 1.1rem; text-align: center; }
    .quick-bet { background: #334155; border: none; color: white; padding: 0 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .quick-bet:hover { background: #475569; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">PRINCESS<span>CASINO</span></div>
    <div class="header-right">
      <div class="balance-box">Balance: <span id="balance">1000.00</span> GEMS</div>
      <a href="index.html" class="btn-back">Back</a>
    </div>
  </header>

  <main class="game-container">
    <div class="panel">
      <div class="dice-display" id="diceDisplay">🎲</div>
      
      <div class="bet-controls">
        <input type="number" class="bet-input" id="betAmount" value="10" min="1">
        <button class="quick-bet" onclick="adjustBet(0.5)">½</button>
        <button class="quick-bet" onclick="adjustBet(2)">2×</button>
      </div>

      <div class="toggle-group">
        <button class="toggle-btn active" id="btnOver" onclick="setMode('over')">Roll Over</button>
        <button class="toggle-btn" id="btnUnder" onclick="setMode('under')">Roll Under</button>
      </div>

      <div class="slider-container">
        <div class="slider-label">
          <span>Target: <span id="targetVal" style="color: white; font-weight: bold;">50</span></span>
          <span id="winChance">Win Chance: 50%</span>
        </div>
        <input type="range" id="targetSlider" min="2" max="98" value="50" step="1" oninput="updateStats()">
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Multiplier</div>
          <div class="stat-value" id="multiplierVal">1.98x</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Payout</div>
          <div class="stat-value" id="payoutVal">19.80</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Profit</div>
          <div class="stat-value" id="profitVal" style="color: #22c55e;">9.80</div>
        </div>
      </div>

      <button class="btn-roll" id="rollBtn" onclick="rollDice()">Roll Dice</button>
      <div class="result-display" id="resultText"></div>
    </div>
  </main>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
      else if (type === 'win') { osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
      else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
    }

    let balance = parseFloat(localStorage.getItem('princessBalance')) || 1000.00;
    document.getElementById('balance').innerText = balance.toFixed(2);
    function saveBalance() { localStorage.setItem('princessBalance', balance.toFixed(2)); document.getElementById('balance').innerText = balance.toFixed(2); }

    let mode = 'over';
    const diceEmojis = ['', '⚁', '', '⚃', '⚄', '⚅'];

    function adjustBet(factor) {
      playSound('click');
      const input = document.getElementById('betAmount');
      input.value = Math.max(1, Math.floor(parseFloat(input.value) * factor));
      updateStats();
    }

    function setMode(newMode) {
      playSound('click');
      mode = newMode;
      document.getElementById('btnOver').className = mode === 'over' ? 'toggle-btn active' : 'toggle-btn';
      document.getElementById('btnUnder').className = mode === 'under' ? 'toggle-btn active' : 'toggle-btn';
      updateStats();
    }

    function updateStats() {
      const target = parseInt(document.getElementById('targetSlider').value);
      const bet = parseFloat(document.getElementById('betAmount').value) || 0;
      
      document.getElementById('targetVal').innerText = target;
      
      let chance = mode === 'over' ? (100 - target) : target;
      let multiplier = 99 / chance;
      let payout = bet * multiplier;
      let profit = payout - bet;
      
      document.getElementById('multiplierVal').innerText = multiplier.toFixed(2) + 'x';
      document.getElementById('payoutVal').innerText = payout.toFixed(2);
      document.getElementById('profitVal').innerText = profit.toFixed(2);
      document.getElementById('winChance').innerText = `Win Chance: ${chance}%`;
    }

    function rollDice() {
      const bet = parseFloat(document.getElementById('betAmount').value);
      const target = parseInt(document.getElementById('targetSlider').value);
      
      if (bet > balance || bet <= 0) {
        document.getElementById('resultText').innerText = "Invalid bet!";
        document.getElementById('resultText').className = "result-display lose";
        return;
      }

      playSound('click');
      balance -= bet;
      saveBalance();
      
      const btn = document.getElementById('rollBtn');
      const dice = document.getElementById('diceDisplay');
      const resultText = document.getElementById('resultText');
      
      btn.disabled = true;
      dice.classList.add('rolling');
      resultText.innerText = "Rolling...";
      resultText.className = "result-display";
      
      // Animate dice
      let rolls = 0;
      const rollInterval = setInterval(() => {
        dice.innerText = diceEmojis[Math.floor(Math.random() * 6)];
        rolls++;
        if (rolls > 10) {
          clearInterval(rollInterval);
          finishRoll(bet, target);
        }
      }, 100);
    }

    function finishRoll(bet, target) {
      const roll = Math.floor(Math.random() * 100) + 1; // 1-100
      const diceNum = Math.floor((roll - 1) / 16.66); // Convert to 0-5 for dice emoji
      const dice = document.getElementById('diceDisplay');
      dice.classList.remove('rolling');
      dice.innerText = diceEmojis[diceNum];
      
      const chance = mode === 'over' ? (100 - target) : target;
      const multiplier = 99 / chance;
      
      let won = false;
      if (mode === 'over' && roll > target) won = true;
      if (mode === 'under' && roll < target) won = true;
      
      const resultText = document.getElementById('resultText');
      const btn = document.getElementById('rollBtn');
      
      if (won) {
        const winAmount = bet * multiplier;
        balance += winAmount;
        saveBalance();
