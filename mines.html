<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines | Princess Casino</title>
  <style>
    /* --- STAKE-INSPIRED DARK THEME --- */
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #fbbf24; } .logo span { color: #ec4899; }
    .balance-box { background: #0f172a; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 6px; color: #4ade80; font-weight: bold; }
    .btn-back { background: #334155; color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; }

    .game-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 300px 1fr; gap: 1rem; width: 100%; box-sizing: border-box; }
    
    /* --- CONTROLS (LEFT SIDE) --- */
    .controls-panel { background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .input-group label { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }
    .input-wrapper { display: flex; background: #0f172a; border: 1px solid #334155; border-radius: 6px; overflow: hidden; }
    .input-wrapper input, .input-wrapper select { flex: 1; background: transparent; border: none; color: white; padding: 0.75rem; font-size: 1rem; outline: none; }
    .input-wrapper button { background: #334155; border: none; color: white; padding: 0 1rem; cursor: pointer; font-weight: bold; }
    .input-wrapper button:hover { background: #475569; }
    
    .btn-bet { width: 100%; padding: 1rem; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
    .btn-bet.green { background: #22c55e; color: white; box-shadow: 0 4px 0 #16a34a; }
    .btn-bet.green:active { transform: translateY(4px); box-shadow: none; }
    .btn-bet.orange { background: #f97316; color: white; box-shadow: 0 4px 0 #c2410c; }
    .btn-bet.orange:active { transform: translateY(4px); box-shadow: none; }
    .btn-bet:disabled { background: #475569; color: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }

    /* --- GAME GRID (RIGHT SIDE) --- */
    .grid-panel { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 450px; }
    
    .tile { 
      aspect-ratio: 1; 
      background: linear-gradient(145deg, #2a3b55, #1e293b); 
      border-radius: 8px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 2.5rem; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 0 #0f172a;
      border: 1px solid #334155;
    }
    .tile:hover:not(.revealed) { transform: translateY(-2px); background: linear-gradient(145deg, #334155, #2a3b55); }
    .tile:active:not(.revealed) { transform: translateY(2px); box-shadow: none; }
    
    .tile.revealed { cursor: default; transform: scale(0.95); box-shadow: none; }
    .tile.gem { background: linear-gradient(145deg, #16a34a, #15803d); border-color: #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); animation: pop 0.3s ease; }
    .tile.mine { background: linear-gradient(145deg, #dc2626, #b91c1c); border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); animation: shake 0.4s ease; }
    .tile.disabled { opacity: 0.5; cursor: not-allowed; }

    @keyframes pop { 0% { transform: scale(0.5); } 50% { transform: scale(1.1); } 100% { transform: scale(0.95); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    .status-bar { margin-top: 1.5rem; font-size: 1.2rem; font-weight: 700; min-height: 1.5rem; text-align: center; }
    .status-bar.win { color: #22c55e; }
    .status-bar.lose { color: #ef4444; }

    @media (max-width: 768px) {
      .game-container { grid-template-columns: 1fr; }
      .controls-panel { order: 2; }
      .grid-panel { order: 1; padding: 1rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">PRINCESS<span>CASINO</span></div>
    <div class="header-right">
      <div class="balance-box">Balance: <span id="balance">1000.00</span> GEMS</div>
      <a href="index.html" class="btn-back">Back</a>
    </div>
  </header>

  <main class="game-container">
    <!-- Left Panel: Controls -->
    <div class="controls-panel">
      <div class="input-group">
        <label>Bet Amount</label>
        <div class="input-wrapper">
          <button onclick="adjustBet(0.5)">½</button>
          <input type="number" id="betAmount" value="10.00" min="1" step="1">
          <button onclick="adjustBet(2)">2×</button>
        </div>
      </div>
      
      <div class="input-group">
        <label>Mines (1-24)</label>
        <div class="input-wrapper">
          <select id="mineCount" disabled>
            <option value="1">1 Mine</option>
            <option value="3" selected>3 Mines</option>
            <option value="5">5 Mines</option>
            <option value="10">10 Mines</option>
            <option value="20">20 Mines</option>
          </select>
        </div>
      </div>

      <button class="btn-bet green" id="actionBtn" onclick="handleAction()">Bet</button>
    </div>

    <!-- Right Panel: Grid -->
    <div class="grid-panel">
      <div class="grid" id="grid"></div>
      <div class="status-bar" id="status"></div>
    </div>
  </main>
