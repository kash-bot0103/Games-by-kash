<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crash | Demo Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f0f;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }
    .logo { font-weight: 700; font-size: 18px; }
    .balance-box {
      background: #262626;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .balance-box span { color: #00e701; }
    .back-btn {
      background: #333;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .main {
      flex: 1;
      padding: 20px 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }
    .multiplier {
      font-size: 64px;
      font-weight: 700;
      text-align: center;
      margin: 40px 0 10px;
      color: #00e701;
    }
    .multiplier.crashed { color: #ff3b3b; }
    .status {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 15px;
      min-height: 22px;
    }
    .bet-section {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
    }
    .bet-label { color: #888; font-size: 13px; margin-bottom: 8px; }
    .bet-input {
      width: 100%;
      background: #262626;
      border: 1px solid #333;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-bet { background: #00e701; color: #000; }
    .btn-cashout { background: #ffcc00; color: #000; display: none; }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <header class="header">
    <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
    <div class="logo">CRASH</div>
    <div class="balance-box">$ <span id="balance">1000.00</span></div>
  </header>

  <main class="main">
    <div class="multiplier" id="multiplier">1.00x</div>
    <div class="status" id="status">Place your bet</div>

    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <input type="number" class="bet-input" id="betAmount" value="10" min="1" step="1">
      
      <button class="btn btn-bet" id="betBtn" onclick="startGame()">Bet</button>
      <button class="btn btn-cashout" id="cashoutBtn" onclick="cashOut()">Cash Out</button>
    </div>
  </main>

  <script>
    // Balance
    function getBalance() {
      return parseFloat(localStorage.getItem('demoBalance')) || 1000;
    }
    function setBalance(amount) {
      localStorage.setItem('demoBalance', amount.toFixed(2));
      document.getElementById('balance').textContent = amount.toFixed(2);
    }
    setBalance(getBalance());

    let isRunning = false;
    let currentMult = 1.00;
    let crashAt = 0;
    let betAmount = 0;
    let timer = null;

    function startGame() {
      if (isRunning) return;

      betAmount = parseFloat(document.getElementById('betAmount').value);

      if (!betAmount || betAmount <= 0) {
        alert('Enter a valid bet amount');
        return;
      }
      if (betAmount > getBalance()) {
        alert('Not enough balance');
        return;
      }

      // Take the bet
      setBalance(getBalance() - betAmount);

      // Generate crash point (between 1.00 and ~10x mostly)
      crashAt = Math.max(1.00, (0.99 / (1 - Math.random()))).toFixed(2);
      crashAt = parseFloat(crashAt);

      isRunning = true;
      currentMult = 1.00;

      document.getElementById('betBtn').style.display = 'none';
      document.getElementById('cashoutBtn').style.display = 'block';
      document.getElementById('status').textContent = 'Game is running...';
      document.getElementById('multiplier').classList.remove('crashed');
      document.getElementById('multiplier').style.color = '#00e701';

      timer = setInterval(function() {
        currentMult += 0.01 + (currentMult * 0.005);
        document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';

        if (currentMult >= crashAt) {
          endGame(false);
        }
      }, 70);
    }

    function cashOut() {
      if (!isRunning) return;
      endGame(true);
    }

    function endGame(won) {
      clearInterval(timer);
      isRunning = false;

      document.getElementById('betBtn').style.display = 'block';
      document.getElementById('cashoutBtn').style.display = 'none';

      if (won) {
        const profit = betAmount * currentMult;
        setBalance(getBalance() + profit);
        document.getElementById('status').textContent = `Cashed out at ${currentMult.toFixed(2)}x • Won $${profit.toFixed(2)}`;
      } else {
        document.getElementById('multiplier').style.color = '#ff3b3b';
        document.getElementById('multiplier').classList.add('crashed');
        document.getElementById('status').textContent = `Crashed at ${crashAt.toFixed(2)}x`;
      }
    }
  </script>
</body>
</html>
