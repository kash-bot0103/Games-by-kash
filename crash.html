<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crash | Princess Casino</title>
  <style>
    /* --- STAKE-INSPIRED DARK THEME --- */
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #fbbf24; } .logo span { color: #ec4899; }
    .balance-box { background: #0f172a; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 6px; color: #4ade80; font-weight: bold; }
    .btn-back { background: #334155; color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; }

    .game-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 300px 1fr; gap: 1rem; width: 100%; box-sizing: border-box; }
    
    /* --- BET CONTROLS (LEFT SIDE) --- */
    .controls-panel { background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .input-group label { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }
    .bet-input-wrapper { display: flex; background: #0f172a; border: 1px solid #334155; border-radius: 6px; overflow: hidden; }
    .bet-input-wrapper input { flex: 1; background: transparent; border: none; color: white; padding: 0.75rem; font-size: 1rem; text-align: center; outline: none; }
    .bet-input-wrapper button { background: #334155; border: none; color: white; padding: 0 1rem; cursor: pointer; font-weight: bold; }
    .bet-input-wrapper button:hover { background: #475569; }
    
    .btn-bet { width: 100%; padding: 1rem; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
    .btn-bet.green { background: #22c55e; color: white; box-shadow: 0 4px 0 #16a34a; }
    .btn-bet.green:active { transform: translateY(4px); box-shadow: none; }
    .btn-bet.orange { background: #f97316; color: white; box-shadow: 0 4px 0 #c2410c; }
    .btn-bet.orange:active { transform: translateY(4px); box-shadow: none; }
    .btn-bet:disabled { background: #475569; color: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }

    /* --- GRAPH AREA (RIGHT SIDE) --- */
    .graph-panel { background: #1e293b; border-radius: 12px; border: 1px solid #334155; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .graph-header { padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .multiplier-display { font-size: 3rem; font-weight: 800; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .multiplier-display.crashed { color: #ef4444; }
    .multiplier-display.cashed { color: #22c55e; }
    
    canvas { width: 100%; height: 400px; display: block; }
    
    .history-bar { height: 40px; background: #0f172a; display: flex; align-items: center; padding: 0 1rem; gap: 0.5rem; overflow-x: auto; border-top: 1px solid #334155; }
    .history-pill { padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; }
    .history-pill.low { background: #334155; color: #94a3b8; }
    .history-pill.high { background: #22c55e; color: white; }
    .history-pill.mega { background: #fbbf24; color: #0f172a; }

    @media (max-width: 768px) {
      .game-container { grid-template-columns: 1fr; }
      .graph-panel { order: -1; } /* Graph on top on mobile */
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">PRINCESS<span>CASINO</span></div>
    <div class="header-right">
      <div class="balance-box">Balance: <span id="balance">1000.00</span> GEMS</div>
      <a href="index.html" class="btn-back">Back</a>
    </div>
  </header>

  <main class="game-container">
    <!-- Left Panel: Controls -->
    <div class="controls-panel">
      <div class="input-group">
        <label>Bet Amount</label>
        <div class="bet-input-wrapper">
          <button onclick="adjustBet(0.5)">½</button>
          <input type="number" id="betAmount" value="10.00" min="1" step="1">
          <button onclick="adjustBet(2)">2×</button>
        </div>
      </div>
      
      <button class="btn-bet green" id="actionBtn" onclick="handleAction()">Place Bet</button>
      
      <div style="margin-top: auto; font-size: 0.8rem; color: #64748b; text-align: center;">
        Auto Cashout: <span style="color: #4ade80;">2.00x</span> (Coming Soon)
      </div>
    </div>

    <!-- Right Panel: Graph -->
    <div class="graph-panel">
      <div class="graph-header">
        <span style="color: #94a3b8; font-weight: bold;">CRASH</span>
        <div style="display: flex; gap: 5px;">
          <div style="width: 10px; height: 10px; background: #22c55e; border-radius: 50%;"></div>
          <div style="width: 10px; height: 10px; background: #334155; border-radius: 50%;"></div>
        </div>
      </div>
      
      <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
      <canvas id="gameCanvas"></canvas>
      
      <div class="history-bar" id="historyBar">
        <!-- History items will appear here -->
      </div>
    </div>
  </main>

  <script>
    // --- SOUND & BALANCE SYSTEM ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
      else if (type === 'win') { osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
      else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
    }

    let balance = parseFloat(localStorage.getItem('princessBalance')) || 1000.00;
    document.getElementById('balance').innerText = balance.toFixed(2);
    function saveBalance() { localStorage.setItem('princessBalance', balance.toFixed(2)); document.getElementById('balance').innerText = balance.toFixed(2); }

    // --- GAME LOGIC ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multiplierDisplay = document.getElementById('multiplierDisplay');
    const actionBtn = document.getElementById('actionBtn');
    const historyBar = document.getElementById('historyBar');

    let gameState = 'idle'; // idle, running, crashed
    let currentMultiplier = 1.00;
    let crashPoint = 0;
    let betAmount = 0;
    let hasCashedOut = false;
    let animationId;
    let startTime;
    let history = [];

    // Resize canvas
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = 400;
      drawGraph(0); // Redraw initial state
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function adjustBet(factor) {
      playSound('click');
      const input = document.getElementById('betAmount');
      input.value = (parseFloat(input.value) * factor).toFixed(2);
    }

    function handleAction() {
      if (gameState === 'idle') {
        startGame();
      } else if (gameState === 'running' && !hasCashedOut) {
        cashOut();
      }
    }

    function startGame() {
      const betInput = document.getElementById('betAmount');
      betAmount = parseFloat(betInput.value);
      
      if (betAmount > balance || betAmount <= 0) {
        alert('Invalid bet!');
        return;
      }

      playSound('click');
      balance -= betAmount;
      saveBalance();
      
      gameState = 'running';
      currentMultiplier = 1.00;
      hasCashedOut = false;
      startTime = Date.now();
      
      // Generate crash point (simple algorithm)
      // 1% chance of instant crash at 1.00x
      if (Math.random() < 0.01) {
        crashPoint = 1.00;
      } else {
        // Exponential distribution for realistic crash curve
        crashPoint = Math.max(1.00, (0.99 / (1 - Math.random())));
        if (crashPoint > 100) crashPoint = 100; // Cap at 100x for demo
      }

      multiplierDisplay.className = 'multiplier-display';
      multiplierDisplay.innerText = '1.00x';
      actionBtn.innerText = 'Cash Out';
      actionBtn.className = 'btn-bet orange';
      betInput.disabled = true;

      animate();
    }

    function cashOut() {
      if (gameState !== 'running' || hasCashedOut) return;
      
      hasCashedOut = true;
      const winAmount = betAmount * currentMultiplier;
      balance += winAmount;
      saveBalance();
      playSound('win');
      
      actionBtn.innerText = `Cashed Out @ ${currentMultiplier.toFixed(2)}x`;
      actionBtn.disabled = true;
      multiplierDisplay.classList.add('cashed');
    }

    function crash() {
      gameState = 'crashed';
      cancelAnimationFrame(animationId);
      playSound('lose');
      
      multiplierDisplay.innerText = `Crashed @ ${crashPoint.toFixed(2)}x`;
      multiplierDisplay.classList.add('crashed');
      actionBtn.innerText = 'Place Bet';
      actionBtn.className = 'btn-bet green';
      actionBtn.disabled = false;
      document.getElementById('betAmount').disabled = false;
      
      addHistory(crashPoint);
      drawGraph(crashPoint); // Draw final frame
    }

    function addHistory(point) {
      history.unshift(point);
      if (history.length > 10) history.pop();
      
      historyBar.innerHTML = history.map(p => {
        let cls = 'low';
        if (p >= 2) cls = 'high';
        if (p >= 10) cls = 'mega';
        return `<div class="history-pill ${cls}">${p.toFixed(2)}x</div>`;
      }).join('');
    }

    // --- ANIMATION LOOP ---
    function animate() {
      const now = Date.now();
      const elapsed = (now - startTime) / 1000; // seconds
      
      // Exponential growth formula
      currentMultiplier = Math.pow(Math.E, 0.06 * elapsed);
      
      if (currentMultiplier >= crashPoint) {
        currentMultiplier = crashPoint;
        multiplierDisplay.innerText = `${currentMultiplier.toFixed(2)}x`;
        drawGraph(currentMultiplier);
        crash();
        return;
      }

      multiplierDisplay.innerText = `${currentMultiplier.toFixed(2)}x`;
      drawGraph(currentMultiplier);
      
      animationId = requestAnimationFrame(animate);
    }

    // --- DRAWING THE GRAPH ---
    function drawGraph(currentMult) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw Grid
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < canvas.width; i += 50) { ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); }
      for (let i = 0; i < canvas.height; i += 50) { ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); }
      ctx.stroke();

      if (gameState === 'idle') return;

      // Calculate curve points
      // We want the curve to start at bottom-left and go up-right
      const padding = 40;
      const graphWidth = canvas.width - padding * 2;
      const graphHeight = canvas.height - padding * 2;
      
      // Map multiplier to Y position (logarithmic scale looks better)
      const maxMult = Math.max(currentMult * 1.2, 2); // Dynamic scaling
      const progress = (currentMult - 1) / (maxMult - 1);
      
      const startX = padding;
      const startY = canvas.height - padding;
      const endX = padding + (graphWidth * Math.min(progress * 0.8, 1)); // Move right
      const endY = canvas.height - padding - (graphHeight * Math.min(progress, 1)); // Move up

      // Draw Curve
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      // Simple quadratic curve for smoothness
      ctx.quadraticCurveTo(startX + (endX - startX) * 0.5, startY, endX, endY);
      
      ctx.strokeStyle = '#fbbf24'; // Gold line
      ctx.lineWidth = 4;
      ctx.stroke();

      // Fill area under curve
      ctx.lineTo(endX, canvas.height - padding);
      ctx.lineTo(startX, canvas.height - padding);
      ctx.fillStyle = 'rgba(251, 191, 36, 0.1)';
      ctx.fill();

      // Draw Rocket
      ctx.font = '30px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('', endX, endY);
    }
  </script>
</body>
</html>
