<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crash | Demo Casino</title>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background-color: #1e293b; border-bottom: 1px solid #334155; }
    .logo { font-size: 1.5rem; font-weight: 700; } .logo span { color: #3b82f6; }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .balance-box { background-color: #334155; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; color: #4ade80; }
    .btn-reset { background-color: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    .btn-back { background-color: #475569; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .main { flex: 1; padding: 2rem; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; text-align: center; }
    .game-container { background-color: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
    .controls { display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; }
    .control-group { display: flex; flex-direction: column; text-align: left; }
    .control-group label { font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    input { background-color: #0f172a; border: 1px solid #334155; color: white; padding: 0.75rem; border-radius: 6px; font-size: 1rem; }
    .multiplier { font-size: 4rem; font-weight: 700; margin: 2rem 0; color: #3b82f6; }
    .multiplier.crashed { color: #ef4444; }
    .btn-action { background-color: #3b82f6; color: white; border: none; padding: 1rem 2rem; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 1rem; }
    .btn-action:disabled { background-color: #475569; cursor: not-allowed; }
    .btn-cashout { background-color: #22c55e; }
    .status { margin-top: 1rem; font-size: 1.2rem; min-height: 1.5rem; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">DEMO<span>CASINO</span></div>
    <div class="header-right">
      <a href="index.html" class="btn-back">Back</a>
      <div class="balance-box">Balance: <span id="balance">1000.00</span> DEMO</div>
    </div>
  </header>

  <main class="main">
    <h1>📈 Crash</h1>
    <div class="game-container">
      <div class="controls">
        <div class="control-group">
          <label>Bet Amount</label>
          <input type="number" id="betAmount" value="10" min="1">
        </div>
      </div>

      <div class="multiplier" id="multiplier">1.00x</div>
      
      <button class="btn-action" id="actionBtn" onclick="startGame()">Place Bet</button>
      <div class="status" id="status"></div>
    </div>
  </main>

  <script>
    let balance = parseFloat(localStorage.getItem('demoBalance')) || 1000.00;
    let currentMultiplier = 1.00;
    let crashPoint = 0;
    let gameRunning = false;
    let betAmount = 0;
    let gameInterval;

    function updateBalanceDisplay() {
      const balanceEl = document.getElementById('balance');
      if (balanceEl) {
        balanceEl.innerText = balance.toFixed(2);
      }
    }

    function saveBalance() {
      localStorage.setItem('demoBalance', balance.toFixed(2));
      updateBalanceDisplay();
    }

    function startGame() {
      const bet = parseFloat(document.getElementById('betAmount').value);
      if (bet > balance || bet <= 0) {
        document.getElementById('status').innerText = "Invalid bet!";
        return;
      }

      balance -= bet;
      saveBalance();
      betAmount = bet;
      gameRunning = true;
      currentMultiplier = 1.00;
      
      crashPoint = (Math.random() * 100 < 50) ? (1 + Math.random() * 2) : (1 + Math.random() * 10);
      if (Math.random() < 0.1) crashPoint = 1.00 + Math.random() * 0.1;
      
      document.getElementById('actionBtn').innerText = "Cash Out";
      document.getElementById('actionBtn').className = "btn-action btn-cashout";
      document.getElementById('multiplier').classList.remove('crashed');
      document.getElementById('status').innerText = "";
      
      gameInterval = setInterval(() => {
        currentMultiplier += 0.01;
        document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
        
        if (currentMultiplier >= crashPoint) {
          crash();
        }
      }, 50);
    }

    function cashOut() {
      if (!gameRunning) return;
      clearInterval(gameInterval);
      gameRunning = false;
      
      const winAmount = betAmount * currentMultiplier;
      balance += winAmount;
      saveBalance();
      
      document.getElementById('status').innerText = `Cashed out at ${currentMultiplier.toFixed(2)}x! Won ${winAmount.toFixed(2)} DEMO`;
      document.getElementById('status').style.color = "#4ade80";
      resetButton();
    }

    function crash() {
      clearInterval(gameInterval);
      gameRunning = false;
      
      document.getElementById('multiplier').innerText = crashPoint.toFixed(2) + 'x';
      document.getElementById('multiplier').classList.add('crashed');
      document.getElementById('status').innerText = "Crashed! You lost.";
      document.getElementById('status').style.color = "#ef4444";
      resetButton();
    }

    function resetButton() {
      document.getElementById('actionBtn').innerText = "Place Bet";
      document.getElementById('actionBtn').className = "btn-action";
    }

    document.getElementById('actionBtn').onclick = function() {
      if (gameRunning) {
        cashOut();
      } else {
        startGame();
      }
    };

    updateBalanceDisplay();
  </script>
</body>
</html>
