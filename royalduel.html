<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Duel</title>
  <style>
    /* --- ROYAL DUEL THEME --- */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1120; /* Deep Navy Blue */
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }
    .balance { color: #fbbf24; font-weight: bold; font-size: 1.2rem; }
    .btn-back { background: #1e293b; color: white; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; }

    /* Game Area */
    .game-board {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
    }

    /* Opponent Area */
    .opponent-area { text-align: center; margin-top: 1rem; }
    .opponent-name { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; }
    .cards-hand { display: flex; justify-content: center; gap: -10px; }
    
    /* Card Styling */
    .card {
      width: 60px; height: 90px;
      background: linear-gradient(135deg, #1e3a8a, #172554);
      border: 2px solid #fbbf24; /* Gold Border */
      border-radius: 8px;
      margin-left: -15px; /* Overlap effect */
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .card:first-child { margin-left: 0; }
    .card-crown { font-size: 1.5rem; color: #fbbf24; }

    /* Center Play Area */
    .play-area {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin: 2rem 0;
    }
    .pile {
      width: 70px; height: 100px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold;
    }
    .draw-pile { background: #1e3a8a; border: 2px solid #fbbf24; }
    .active-card { background: #22c55e; color: white; font-size: 2rem; border-radius: 10px; box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }

    /* Player Hand */
    .player-hand {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .player-card {
      width: 70px; height: 100px;
      background: white;
      border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .player-card:hover { transform: translateY(-10px); }
    .card-red { color: #ef4444; }
    .card-gold { color: #d97706; background: #fef3c7; }
