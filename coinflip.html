<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinflip | Princess Casino</title>
  <style>
    /* --- STAKE-INSPIRED DARK THEME --- */
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #fbbf24; } .logo span { color: #ec4899; }
    .balance-box { background: #0f172a; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 6px; color: #4ade80; font-weight: bold; }
    .btn-back { background: #334155; color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; }

    .game-container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; width: 100%; box-sizing: border-box; align-items: center; }
    
    /* --- CONTROLS --- */
    .controls-panel { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 1.5rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .input-group label { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }
    .input-wrapper { display: flex; background: #0f172a; border: 1px solid #334155; border-radius: 6px; overflow: hidden; }
    .input-wrapper input { flex: 1; background: transparent; border: none; color: white; padding: 0.75rem; font-size: 1rem; outline: none; text-align: center; }
    .input-wrapper button { background: #334155; border: none; color: white; padding: 0 1rem; cursor: pointer; font-weight: bold; }
    .input-wrapper button:hover { background: #475569; }
    
    .choice-group { display: flex; background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
    .choice-btn { flex: 1; padding: 1rem; background: transparent; border: none; color: #64748b; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
    .choice-btn.active { background: #3b82f6; color: white; }
    
    .btn-flip { width: 100%; padding: 1rem; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.2s; text-transform: uppercase; background: #22c55e; color: white; box-shadow: 0 4px 0 #16a34a; }
    .btn-flip:active { transform: translateY(4px); box-shadow: none; }
    .btn-flip:disabled { background: #475569; color: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }

    /* --- COIN ANIMATION --- */
    .coin-area { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; }
    .coin-container { perspective: 1000px; width: 180px; height: 180px; margin-bottom: 2rem; }
    .coin { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; border: 6px solid #fbbf24; box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.2); text-transform: uppercase; letter-spacing: 2px; }
    .heads { background: linear-gradient(135deg, #fbbf24, #d97706); color: #451a03; }
    .tails { background: linear-gradient(135deg, #94a3b8, #475569); color: #0f172a; transform: rotateY(180deg); border-color: #cbd5e1; }
    
    .result-display { font-size: 1.5rem; font-weight: 700; min-height: 2rem; text-align: center; }
    .win { color: #22c55e; text-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }
    .lose { color: #ef4444; }

    @media (max-width: 768px) {
      .game-container { grid-template-columns: 1fr; }
      .coin-area { order: -1; min-height: 250px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">PRINCESS<span>CASINO</span></div>
    <div class="header-right">
      <div class="balance-box">Balance: <span id="balance">1000.00</span> GEMS</div>
      <a href="index.html" class="btn-back">Back</a>
    </div>
  </header>

  <main class="game-container">
    <!-- Controls -->
    <div class="controls-panel">
      <div class="input-group">
        <label>Bet Amount</label>
        <div class="input-wrapper">
          <button onclick="adjustBet(0.5)">½</button>
          <input type="number" id="betAmount" value="10.00" min="1" step="1">
          <button onclick="adjustBet(2)">2×</button>
        </div>
      </div>

      <div class="input-group">
        <label>Choose Side</label>
        <div class="choice-group">
          <button class="choice-btn active" id="btnHeads" onclick="setChoice('heads')">Heads</button>
          <button class="choice-btn" id="btnTails" onclick="setChoice('tails')">Tails</button>
        </div>
      </div>

      <button class="btn-flip" id="flipBtn" onclick="flipCoin()">Flip Coin</button>
    </div>

    <!-- Coin Display -->
    <div class="coin-area">
      <div class="coin-container">
        <div class="coin" id="coin">
          <div class="face heads">HEADS</div>
          <div class="face tails">TAILS</div>
        </div>
      </div>
      <div class="result-display" id="resultText">Pick a side and flip!</div>
    </div>
  </main>

  <script>
    // --- SOUND & BALANCE SYSTEM ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
      else if (type === 'win') { osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
      else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
    }

    let balance = parseFloat(localStorage.getItem('princessBalance')) || 1000.00;
    document.getElementById('balance').innerText = balance.toFixed(2);
    function saveBalance() { localStorage.setItem('princessBalance', balance.toFixed(2)); document.getElementById('balance').innerText = balance.toFixed(2); }

    // --- GAME LOGIC ---
    let currentChoice = 'heads';
    const coinEl = document.getElementById('coin');
    const flipBtn = document.getElementById('flipBtn');
    const resultText = document.getElementById('resultText');

    function adjustBet(factor) {
      playSound('click');
      const input = document.getElementById('betAmount');
      input.value = (parseFloat(input.value) * factor).toFixed(2);
    }

    function setChoice(choice) {
      playSound('click');
      currentChoice = choice;
      document.getElementById('btnHeads').className = choice === 'heads' ? 'choice-btn active' : 'choice-btn';
      document.getElementById('btnTails').className = choice === 'tails' ? 'choice-btn active' : 'choice-btn';
    }

    function flipCoin() {
      const bet = parseFloat(document.getElementById('betAmount').value);
      if (bet > balance || bet <= 0) { 
        resultText.innerText = "Invalid bet!"; 
        resultText.className = "result-display lose"; 
        return; 
      }

      playSound('click');
      balance -= bet;
      saveBalance();
      
      flipBtn.disabled = true;
      resultText.innerText = "Flipping...";
      resultText.className = "result-display";
      
      // Reset animation
      coinEl.style.transition = 'none';
      coinEl.style.transform = 'rotateY(0deg)';
      void coinEl.offsetWidth; // Trigger reflow
      coinEl.style.transition = 'transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      
      // Determine outcome (50/50)
      const outcome = Math.random() < 0.5 ? 'heads' : 'tails';
      
      // Apply animation (5 full spins + outcome)
      const rotation = outcome === 'heads' ? 1800 : 1980;
      coinEl.style.transform = `rotateY(${rotation}deg)`;

      setTimeout(() => {
        if (currentChoice === outcome) {
          const winAmount = bet * 1.98; // 1.98x multiplier
          balance += winAmount;
          saveBalance();
          playSound('win');
          resultText.innerText = `It's ${outcome.toUpperCase()}! You won ${winAmount.toFixed(2)} GEMS! 🎉`;
          resultText.className = "result-display win";
        } else {
          playSound('lose');
          resultText.innerText = `It's ${outcome.toUpperCase()}. You lost!`;
          resultText.className = "result-display lose";
        }
        flipBtn.disabled = false;
      }, 2000); // Wait for 2s animation
    }
  </script>
</body>
</html>
